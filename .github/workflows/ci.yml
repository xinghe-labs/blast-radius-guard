name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows runner = 真机验证 H3（大小写碰撞）与 H4（NTFS reparse 属性）
        # macos runner = 真机验证 H3（APFS 大小写）与 H13（家目录特殊目录）
        # ubuntu runner = 真机验证 H11/H12（系统前缀、挂载点）
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover tests -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install peer deps
        run: npm install --no-save @earendil-works/pi-coding-agent typescript
      - name: tsc --strict
        run: >
          npx tsc --noEmit --strict --module nodenext
          --moduleResolution nodenext
          --target es2022 --skipLibCheck src/extension.ts

  hook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Hook blocks drive-root delete
        shell: bash
        run: |
          payload='{"tool_name":"Bash","tool_input":'
          payload+='{"command":"rd /s /q D:\\\\"}}'
          echo "$payload" | python3 hooks/pretooluse.py && \
          echo "ERROR: hook should have blocked" && exit 1 || [ $? -eq 2 ]
      - name: Hook allows git status
        shell: bash
        run: |
          payload='{"tool_name":"Bash","tool_input":{"command":"git status"}}'
          echo "$payload" | python3 hooks/pretooluse.py
